<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Юна Aqua Life — 9 версий сайта</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:#1C2A3A;color:#F6F1EA;font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#F6F1EA;text-decoration:none}a:hover{color:#EFB28C}
*{box-sizing:border-box}
</style>
</helmet>
<div style="display:flex;height:100vh">
  <aside style="{{ asideStyle }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px;min-height:40px">
      <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><img src="img/juna-logo-light.png" alt="Юна Aqua Life" style="height:40px;width:auto"></sc-if>
      <button type="button" onClick="{{ toggle }}" aria-label="Свернуть меню" style="flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(246,241,234,.25);background:transparent;color:#F6F1EA;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s" style-hover="background:rgba(246,241,234,.1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style="{{ chevStyle }}"><path d="M15 6l-6 6 6 6"></path></svg></button>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><span style="padding:0 10px 10px;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(246,241,234,.6)">9 версий сайта</span></sc-if>
      <sc-for list="{{ items }}" as="v" hint-placeholder-count="9">
        <button type="button" onClick="{{ v.pick }}" title="{{ v.label }}" style="{{ v.style }}">
          <span style="{{ v.numStyle }}">{{ v.n }}</span>
          <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><span style="display:flex;flex-direction:column;gap:2px;min-width:0;white-space:nowrap"><span style="font-size:14px">{{ v.label }}</span><span style="font-size:11px;color:rgba(246,241,234,.6)">{{ v.note }}</span></span></sc-if>
        </button>
      </sc-for>
    </nav>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}"><a href="{{ curHref }}" target="_blank" rel="noopener" style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:rgba(246,241,234,.75)">Открыть отдельно<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a></sc-if>
  </aside>
  <main style="position:relative;flex:1;min-width:0;background:#F6F1EA">
    <iframe key="{{ curHref }}" src="{{ curHref }}" title="{{ curLabel }}" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#F6F1EA"></iframe>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  _V = [
    ['01-zhurnal.html', 'Журнал', 'Бумага, сериф, главы'],
    ['02-kino.html', 'Кино', 'Чёрный экран, сцены'],
    ['03-modern.html', 'Модерн', 'Сетка, цифры, расчёт'],
    ['04-akva.html', 'Аква', 'Светлая вода, стекло'],
    ['05-klassika.html', 'Классика', 'Liora: navy и абрикос'],
    ['06-shampan.html', 'Шампань', 'Тёплые тона, sticky-бар'],
    ['07-ramka.html', 'Рамка', 'Navy-фон, фото в рамке'],
    ['08-intro.html', 'Интро', 'Тёмная, заставка'],
    ['09-pervyj.html', 'Первый вариант', 'Исходная версия']
  ];
  state = { cur: (() => { const def = this._V[0][0]; try { const f = localStorage.getItem('juna-concept'); return this._V.some((v) => v[0] === f) ? f : def; } catch (e) { return def; } })(), open: true };
  renderVals() {
    const s = this.state, E = 'cubic-bezier(.2,.7,.2,1)', open = s.open, cur = this._V.find((v) => v[0] === s.cur) || this._V[0];
    return {
      open, toggle: () => this.setState({ open: !open }),
      asideStyle: { flex: 'none', width: open ? '250px' : '68px', display: 'flex', flexDirection: 'column', gap: '24px', padding: '24px 14px', borderRight: '1px solid rgba(246,241,234,.1)', transition: 'width .5s ' + E, overflowX: 'hidden', overflowY: 'auto' },
      chevStyle: { transform: open ? 'none' : 'rotate(180deg)', transition: 'transform .5s ' + E },
      curHref: encodeURI(cur[0]), curLabel: cur[1],
      items: this._V.map(([f, label, note], i) => { const on = f === s.cur; return { label, note, n: String(i + 1), pick: () => { try { localStorage.setItem('juna-concept', f); } catch (e) {} this.setState({ cur: f }); },
        style: { display: 'flex', alignItems: 'center', gap: '14px', width: '100%', padding: '8px', border: 0, borderRadius: '8px', background: on ? 'rgba(246,241,234,.08)' : 'transparent', color: '#F6F1EA', textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit', transition: 'background .3s' },
        numStyle: { flex: 'none', width: '36px', height: '36px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Cormorant Garamond',serif", fontSize: '18px', background: on ? '#EFB28C' : 'transparent', color: on ? '#1C2A3A' : '#F6F1EA', border: '1px solid ' + (on ? '#EFB28C' : 'rgba(246,241,234,.28)'), transition: 'background .3s, color .3s, border-color .3s' } }; })
    };
  }
}
</script>
</body>
</html>
